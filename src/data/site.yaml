bio_lead: Agustín Camacho es un fotógrafo y filmmaker uruguayo con más de tres años de experiencia en la creación de piezas audiovisuales con enfoque cinematográfico y contemporáneo.
bio: |-
  Trabaja en fotografía, video y edición, desarrollando proyectos desde la preproducción hasta la postproducción para marcas, eventos y proyectos personales. Su enfoque combina narrativa y estética, buscando crear contenido que no solo sea atractivo, sino que también comunique de forma efectiva la identidad y los valores de cada proyecto.

  Esto es resultado de una formación en cine y fotografía, complementada por una constante búsqueda de aprendizaje autodidacta y experiencia práctica dentro del ámbito audiovisual.
